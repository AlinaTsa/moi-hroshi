<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F4F6">
<title>Мої гроші: прототип v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, [data-look="a"] {
    --bg:#F3F4F6; --card:#FFFFFF; --ink:#1B2430; --muted:#5F6B7A; --line:#E6E9ED; --track:#DCE1E7;
    --accent:#1F4DB8; --on-accent:#FFFFFF; --good:#1D7A4F; --bad:#B3402F; --warn:#9A5B00; --warn-bg:#FBF1E0;
    --p1:#1F4DB8; --p2:#4C74D2; --p3:#7F9FE3; --p4:#AFC3EE; --p5:#D3DEF5;
    --g1:#1F4DB8; --g2:#0E7C86; --g3:#B0642D; --g4:#7A4FB5; --t1:#E6EDFB; --t2:#DDF0F1; --t3:#F6E9DE; --t4:#EEE6F8; --soft:#EEF2F8; --sel:#E6EDFB;
  }
  [data-look="b"] {
    --bg:#0E1217; --card:#171D25; --ink:#E8EDF2; --muted:#98A5B3; --line:#262F3A; --track:#2A3440;
    --accent:#7FB2FF; --on-accent:#0E1217; --good:#6FD3A0; --bad:#F08A7A; --warn:#F2B35A; --warn-bg:#2E2616;
    --p1:#7FB2FF; --p2:#5E8FD6; --p3:#476FAD; --p4:#335185; --p5:#26406B;
    --g1:#7FB2FF; --g2:#8FD6C0; --g3:#F2B35A; --g4:#C3A6F0; --t1:#1E2C42; --t2:#1D3A36; --t3:#3A2F1B; --t4:#2E2542; --soft:#1D252F; --sel:#222C38;
  }
  [data-look="c"] {
    --bg:#F4F3F1; --card:#FFFFFF; --ink:#202020; --muted:#666460; --line:#E8E6E3; --track:#DEDBD7;
    --accent:#1F6F5E; --on-accent:#FFFFFF; --good:#1F6F5E; --bad:#A63A2A; --warn:#8F5A00; --warn-bg:#F8EFDD;
    --p1:#2B2B2B; --p2:#5A5A58; --p3:#8A8885; --p4:#B9B6B2; --p5:#DAD7D3;
    --g1:#1F6F5E; --g2:#A5622B; --g3:#5A5A58; --g4:#7A4FB5; --t1:#E2EFEB; --t2:#F3E7DD; --t3:#ECEAE7; --t4:#EEE6F8; --soft:#F3F1EE; --sel:#ECE9E5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
  #view { flex: 1; min-height: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .tabs { display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tab { flex: 1; min-height: 56px; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; }
  .tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .tab svg { width: 23px; height: 23px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  h2 { margin: 0; font-size: 19px; font-weight: 600; }
  .note { font-size: 13px; color: var(--muted); margin: 0 2px; line-height: 1.4; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px -4px; }
  .sec span { font-size: 13px; color: var(--muted); }
  .head { display: flex; align-items: center; gap: 12px; }
  .head h1 { flex: 1; min-width: 0; }
  .back, .iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; flex: none; }

  .hero-row { position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .hero-row .lbl { font-size: 15px; color: var(--muted); }
  .cur-btn { height: 44px; padding: 0 4px 0 12px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 500; }
  .menu { position: absolute; right: 0; top: 44px; width: 168px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; z-index: 5; }
  .menu button { width: 100%; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
  .menu button[aria-checked="true"] { background: var(--sel); }
  .total { font-size: 46px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; }
  .total.sm { font-size: 38px; } .total.xs { font-size: 32px; }
  .delta { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; font-weight: 500; color: var(--good); }
  .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--track); margin-bottom: 12px; }
  .bar span { display: block; height: 8px; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .two > div { min-width: 0; }
  .pl-n { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .pl-n i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .pl-a { font-size: 18px; font-weight: 500; margin-top: 1px; white-space: nowrap; } .pl-a.sm { font-size: 15px; }
  .big-a { font-size: 22px; font-weight: 600; margin-top: 1px; white-space: nowrap; } .big-a.sm { font-size: 18px; }

  .acc { width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .acc-top { display: flex; align-items: center; gap: 12px; }
  .acc-ico { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; color: #fff; }
  .acc-ico svg { width: 24px; height: 24px; }
  .acc-n { flex: 1; min-width: 0; }
  .acc-n b { display: block; font-size: 17px; font-weight: 500; }
  .acc-n small { display: block; font-size: 13px; color: var(--muted); }
  .acc-t { text-align: right; font-size: 16px; font-weight: 500; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cc { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); white-space: nowrap; }
  .pill { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); font-size: 15px; font-weight: 500; white-space: nowrap; }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .scroll-x { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px; scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  .ghost { min-height: 52px; border-radius: 16px; border: 1px dashed var(--muted); background: transparent; font-size: 16px; font-weight: 500; }
  .primary { min-height: 54px; border-radius: 16px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 500; }
  .primary[disabled] { opacity: .4; cursor: not-allowed; }
  .second { min-height: 50px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); font-size: 16px; font-weight: 500; }
  .danger { color: var(--bad); }
  .push { margin-top: auto; }

  .qa { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .qa button { border: 0; background: var(--card); border-radius: 14px; min-height: 66px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 500; }
  .qa svg { width: 22px; height: 22px; color: var(--accent); }
  .bal { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px; scrollbar-width: none; }
  .bal::-webkit-scrollbar { display: none; }
  .bal button { flex: none; min-width: 118px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 14px; }
  .bal button[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
  .bal small { display: block; font-size: 12px; color: var(--muted); }
  .bal b { display: block; font-size: 17px; font-weight: 500; white-space: nowrap; }
  .list { background: var(--card); border-radius: 18px; padding: 2px 16px; }
  .row { width: 100%; min-height: 58px; border: 0; border-top: 1px solid var(--line); background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; text-align: left; }
  .row:first-child { border-top: 0; }
  .row .l { display: flex; align-items: center; gap: 12px; font-weight: 500; min-width: 0; }
  .row .l small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .row .r { text-align: right; font-weight: 500; white-space: nowrap; }
  .row .r small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .tx-i { width: 36px; height: 36px; border-radius: 18px; background: var(--soft); display: flex; align-items: center; justify-content: center; flex: none; font-size: 16px; }
  .pos { color: var(--good); } .neg { color: var(--ink); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 500; background: var(--soft); color: var(--muted); }
  .badge.ok { background: var(--sel); color: var(--accent); }

  .goal { display: block; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .goal.off { opacity: .72; }
  .g-top { display: flex; align-items: center; gap: 12px; }
  .g-ico { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
  .g-ico svg { width: 26px; height: 26px; }
  .g-name { flex: 1; min-width: 0; }
  .g-name b { display: block; font-size: 17px; font-weight: 500; line-height: 1.2; }
  .g-name small { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .g-pct { font-size: 22px; font-weight: 500; }
  .trk { position: relative; height: 10px; margin-top: 12px; display: block; }
  .trk div { position: absolute; left: 0; top: 0; height: 10px; -webkit-mask-image: repeating-linear-gradient(90deg, #000 0, #000 9px, transparent 9px, transparent 12px); mask-image: repeating-linear-gradient(90deg, #000 0, #000 9px, transparent 9px, transparent 12px); }
  .trk .bg { right: 0; background: var(--track); }
  .g-bot { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 13px; color: var(--muted); gap: 8px; }
  .g-bot .when { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }
  .g-bot svg { width: 15px; height: 15px; }

  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld > label, .lab { font-size: 13px; color: var(--muted); }
  .inp { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 0 14px; font-size: 17px; }
  select.inp { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 22px, calc(100% - 15px) 22px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pv { background: var(--card); border-radius: 18px; padding: 6px 16px; }
  .pv .r2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .pv .r2:first-child { border-top: 0; }
  .pv .r2 > span:first-child { color: var(--muted); }
  .pv .r2 b { font-weight: 500; text-align: right; }
  .arrow { color: var(--muted); margin: 0 4px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
  .warn button { margin-top: 8px; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--warn); background: transparent; color: var(--warn); font-size: 14px; font-weight: 500; }
  .info { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
  .toast { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 500; }
  .opt { width: 100%; min-height: 58px; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 16px; font-weight: 500; }
  .opt small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
  .opt .rad { width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--muted); flex: none; }
  .opt[aria-pressed="true"] .rad { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 5px, transparent 6px); }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--track); }
  .steps i.on { background: var(--accent); }
  .sw { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw button { width: 44px; height: 44px; border-radius: 14px; border: 2px solid transparent; }
  .sw button[aria-pressed="true"] { border-color: var(--ink); }
  .looks { display: flex; flex-direction: column; gap: 10px; }
  .look { min-height: 56px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; }
  .look[aria-pressed="true"] { border-color: var(--accent); }
  .sws { display: flex; gap: 4px; } .sws i { width: 16px; height: 16px; border-radius: 5px; display: block; }
  .chart { background: var(--card); border-radius: 18px; padding: 12px 12px 8px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 4px 2px; }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
  .seg button { flex: 1; height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 15px; font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

  .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .cat-card { border: 0; background: var(--card); border-radius: 20px; padding: 10px 10px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .cat-card svg { width: 100%; max-width: 150px; height: auto; }
  .cat-card b { font-size: 16px; font-weight: 500; }
  .cat-card small { font-size: 12px; color: var(--muted); }
  .rar { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .r-c { background: #E8EEE9; color: #3B5A47; } .r-r { background: #E1ECFB; color: #1F4DB8; } .r-e { background: #EEE3FA; color: #6A3FB0; } .r-l { background: #FBEBCF; color: #8A5300; } .r-m { background: #FADDE8; color: #A12A5B; }
  [data-look="b"] .r-c { background: #22332A; color: #9FD5B0; } [data-look="b"] .r-r { background: #1E2C42; color: #8FB4FF; } [data-look="b"] .r-e { background: #2E2542; color: #C3A6F0; } [data-look="b"] .r-l { background: #3A2F1B; color: #F2B35A; } [data-look="b"] .r-m { background: #3B2230; color: #F08AB0; }
  .stage { position: relative; background: var(--card); border-radius: 24px; padding: 18px 12px 12px; display: flex; flex-direction: column; align-items: center; }
  .stage svg { width: 78%; max-width: 280px; height: auto; }

  .ov { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #F5F0FF; background: radial-gradient(circle at 50% 38%, #4B3A8F 0%, #241A4D 45%, #0E0A24 100%); animation: ovin .5s ease both; }
  .ov .rings { position: absolute; left: 50%; top: 38%; width: 0; height: 0; }
  .ov .rings i { position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; border-radius: 50%; border: 2px solid rgba(255,220,150,.55); animation: ring 2.4s ease-out infinite; }
  .ov .rings i:nth-child(2) { animation-delay: .8s; } .ov .rings i:nth-child(3) { animation-delay: 1.6s; }
  .ov .catwrap { width: 220px; animation: pop 1.1s cubic-bezier(.2,.9,.3,1.3) .5s both; position: relative; z-index: 2; }
  .ov .catwrap svg { width: 100%; height: auto; filter: drop-shadow(0 0 24px rgba(255,214,120,.55)); }
  .ov .sp { position: absolute; left: 50%; top: 38%; width: 8px; height: 8px; border-radius: 50%; background: #FFD98A; opacity: 0; animation: spark 1.8s ease-out 1.1s both; }
  .ov .msg { position: relative; z-index: 2; margin-top: 18px; animation: fadeup .8s ease 1.4s both; }
  .ov .msg small { display: block; font-size: 15px; color: #FFD98A; letter-spacing: .02em; }
  .ov .msg h2 { font-size: 26px; margin: 6px 0 4px; font-weight: 600; }
  .ov .msg p { margin: 8px auto 0; max-width: 300px; font-size: 15px; line-height: 1.45; color: #D9D0F2; }
  .ov .btns { position: relative; z-index: 2; margin-top: 22px; display: flex; gap: 10px; animation: fadeup .8s ease 1.8s both; }
  .ov .btns button { min-height: 48px; padding: 0 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; font-size: 16px; }
  .ov .btns .main { background: #FFD98A; color: #2A1B5B; border-color: #FFD98A; font-weight: 500; }
  body.calm .ov, body.calm .ov * { animation: none !important; opacity: 1 !important; transform: none !important; }
  body.calm .ov .sp, body.calm .ov .rings { display: none; }
  @keyframes ovin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ring { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(.1) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.12) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes spark { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .ov, .ov * { animation: none !important; opacity: 1 !important; transform: none !important; } .ov .sp, .ov .rings { display: none; } }
  @media (min-width: 520px) { body { background: #D9DCE0; } .app { height: min(100dvh, 874px); border-left: 1px solid #C6CAD0; border-right: 1px solid #C6CAD0; } }

  .curctl { position: relative; display: inline-block; }
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .row.void { color: var(--muted); }
  .row.void .r { text-decoration: line-through; color: var(--muted); }
  .row.void .tx-i { opacity: .55; }
  .pendline { border: 0; background: transparent; padding: 0; margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--accent); text-align: left; line-height: 1.2; }
  .pendline i { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .big-inp { width: 100%; height: 64px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); padding: 0 16px; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  #view > * { flex-shrink: 0; }
  .shelf { min-height: 72px; width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 12px 14px; background: linear-gradient(120deg, var(--t4), var(--card) 70%); display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
  .shelf b { display: block; font-size: 16px; font-weight: 500; }
  .shelf small { display: block; font-size: 13px; color: var(--muted); }
  .minis { display: flex; flex: none; }
  .mini { width: 46px; height: 46px; border-radius: 50%; background: var(--card); border: 2px solid var(--t4); overflow: hidden; margin-left: -12px; display: block; }

      $('pv').innerHTML = '<div class="r2"><span>Усього вносите</span><b>' + conv(sum) + '</b></div><div class="r2"><span>Вільні гроші</span><b>' + conv(F) + '<span class="arrow">→</span>' + conv(F - sum) + '</b></div><div class="r2"><span>Відкладено</span><b>' + conv(pool()) + '<span class="arrow">→</span>' + conv(pool() + sum) + '</b></div><div class="r2"><span>Загальний капітал</span><b>без змін</b></div>';
      $('err').innerHTML = bad ? '<div class="warn" role="alert">Вільних грошей не вистачає на ' + conv(sum - F) + '. Зменште внески.</div>' : '';
      $('ok').disabled = !(sum > 0) || bad; S.cv = per;
    };
    return '<div class="head"><button type="button" class="back" data-act="back" aria-label="Назад">' + ic('left') + '</button><h1>Внести в цілі</h1></div><div class="info">Вільні гроші: <b>' + conv(free()) + '</b>. Це разовий внесок додатково до автовідкладання. Рахунки й капітал не змінюються.</div>' +
      ag.map(function (g) { var c = GCOL[g.id] || GCOL.extra; return '<div class="card"><div class="g-top"><span class="g-ico" style="background:' + c[1] + ';color:' + c[0] + ';width:36px;height:36px">' + ic(g.icon, 22) + '</span><span class="g-name"><b>' + esc(g.name) + '</b><small>за планом ' + planShort(g) + ' · зараз ' + fmtC(g.saved, g.cur) + '</small></span></div><div class="fld" style="margin-top:10px"><label for="c-' + g.id + '">Скільки вносите, ' + g.cur + '</label><input class="inp" id="c-' + g.id + '" inputmode="decimal" data-calc="1" value="' + g.amt + '"></div></div>'; }).join('') +
      '<div class="pv" id="pv"></div><div id="err"></div><button type="button" class="primary push" id="ok" data-act="contrib-ok" disabled>Підтвердити внески</button>';
  }
  function R_plan() {
    var EXP = [['Оренда', 250, 'фікс.'], ['Комунальні', 60, 'фікс.'], ['Продукти', 150, 'змінні'], ['Тварини', 40, 'змінні'], ['Транспорт', 30, 'змінні'], ['Підписки', 20, 'фікс.'], ['Страхування', 20, 'фікс.'], ['Здоров’я', 30, 'змінні']];
    return '<div class="head"><button type="button" class="back" data-act="back" aria-label="Назад">' + ic('left') + '</button><h1>Дохід і витрати</h1></div><div class="sec"><h2>Регулярні надходження</h2></div>' +
      '<div class="list">' + RECUR.filter(function (r) { return r.amt > 0; }).map(function (r) { return '<div class="row"><span class="l"><span>' + esc(r.note) + '<small>' + recText(r) + ' · ' + esc(accById(r.acc).n) + '</small></span></span><span class="r">' + fmtC(r.amt, r.cur) + '<small><span class="badge' + (r.pending ? ' ok' : '') + '">' + (r.pending ? 'чекає підтвердження' : r.auto ? 'автоматично' : 'спитаю') + '</span></small></span></div>'; }).join('') + '</div>' +
      '<button type="button" class="ghost" data-act="add-recur">Додати регулярний дохід</button><p class="note">Плановий дохід впливає на прогноз. На баланс він потрапляє, коли ви підтвердите «Прийшло» (або якщо ввімкнено автоматично).</p>' +
      '<div class="sec"><h2>Планові витрати</h2><span>' + fmtC(EXPENSES, 'USD') + ' на місяць</span></div><div class="list">' + EXP.map(function (e) { return '<div class="row" style="min-height:48px"><span class="l" style="font-weight:400">' + e[0] + ' <span class="badge">' + e[2] + '</span></span><span class="r">' + fmtC(e[1], 'USD') + '</span></div>'; }).join('') + '</div><p class="note">Планові витрати не списуються з рахунків. Щодня вести витрати не потрібно.</p><button type="button" class="ghost">Закрити місяць (факт)</button>';
  }
  function R_more() {
    var L = [['a', 'А · Синій', ['#1F4DB8', '#4C74D2', '#7FA0E3']], ['b', 'Б · Ніч', ['#7FB2FF', '#5E8FD6', '#335185']], ['c', 'В · Графіт', ['#2B2B2B', '#8A8885', '#1F6F5E']]];
    return '<h1>Ще</h1><div class="sec"><h2>Основна валюта</h2></div><div class="chips">' + PRIMARY.map(function (c) { return '<button type="button" class="pill" data-act="set-def" data-id="' + c + '" aria-pressed="' + (S.def === c) + '">' + NAMES[c] + ' ' + SYM[c] + '</button>'; }).join('') + '</div><p class="note">Вона підставляється за замовчуванням, коли ви створюєте цілі, і є початковою для всіх підсумків.</p>' +
      '<div class="list"><button type="button" class="row" data-act="go" data-id="plan"><span class="l">Дохід і витрати</span>' + ic('right', 18, 'var(--muted)') + '</button><button type="button" class="row"><span class="l">Закрити місяць</span>' + ic('right', 18, 'var(--muted)') + '</button><button type="button" class="row"><span class="l">Курси валют</span>' + ic('right', 18, 'var(--muted)') + '</button></div>' +
      '<div class="sec"><h2>Для дизайну</h2></div><div class="list"><button type="button" class="row" data-act="go" data-id="catsheet"><span class="l">Концепт колекції котів</span>' + ic('right', 18, 'var(--muted)') + '</button><button type="button" class="row" data-act="demo-unlock" data-id="trav"><span class="l">Показати появу кота</span>' + ic('right', 18, 'var(--muted)') + '</button></div>' +
      '<div class="sec"><h2>Анімації</h2></div>' + opt2('toggle-calm', '', 'Без руху', 'покаже появу кота без анімацій', S.calm) + opt2('toggle-sound', '', 'Звук', 'за замовчуванням вимкнено', S.sound) +
      '<div class="sec"><h2>Вигляд</h2></div><div class="looks">' + L.map(function (l) { return '<button type="button" class="look" data-act="look" data-id="' + l[0] + '" aria-pressed="' + (S.look === l[0]) + '"><span>' + l[1] + '</span><span class="sws">' + l[2].map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') + '</span></button>'; }).join('') + '</div><p class="note">Прототип: цифри вигадані, нічого не зберігається. Це не ваш справжній додаток.</p>';
  }
  R['acc-fix'] = R_acc_fix; R['confirm-in'] = R_confirm_in; PARENT['acc-fix'] = 'accounts'; PARENT['confirm-in'] = 'home';
  R.home = R_home; R.accounts = R_accounts; R.account = R_account; R.money = R_money; R.tx = R_tx; R.goals = R_goals; R.goal = R_goal; R['goal-new'] = R_goal_new; R.contribute = R_contribute; R.plan = R_plan; R.more = R_more;
  S.cur = S.def;

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id'), keep = false;
    if (a === 'open-confirm') return go('confirm-in', { id: id });
    else if (a === 'confirm-ok') { var r = RECUR.filter(function (x) { return x.id === id; })[0], amt = fnum('c-amt'); if (!(amt > 0)) return; addTx({ acc: r.acc, type: 'in', amt: amt, cur: r.cur, date: DATE0, note: r.note, eff: [[r.acc, r.cur, amt]] }); r.pending = false; S.toast = 'Зараховано ' + fmtC(amt, r.cur) + ' на ' + accById(r.acc).n + '.'; return tabTo('home'); }
    else if (a === 'confirm-skip') { RECUR.filter(function (x) { return x.id === id; })[0].pending = false; S.toast = 'Пропущено. Наступне надходження за розкладом.'; return tabTo('home'); }
    else if (a === 'tx-cancel') { var tx = TX.filter(function (x) { return x.id === Number(id); })[0]; if (cancelTx(tx, true)) S.toast = 'Операцію скасовано. Суми повернуто, запис лишився сірим.'; }
    else if (a === 'tx-restore') { var tx2 = TX.filter(function (x) { return x.id === Number(id); })[0]; if (cancelTx(tx2, false)) S.toast = 'Операцію відновлено.'; }
    else if (a === 'tx-desc-save') { var tx3 = TX.filter(function (x) { return x.id === Number(id); })[0]; tx3.note = val('t-desc').trim(); S.toast = 'Опис збережено.'; }
    else if (a === 'm-rep') { S.m.rep = id; keep = true; }
    else if (a === 'm-auto') { S.m.auto = !S.m.auto; keep = true; }
    else if (a === 'g-freq') { S.gn.freq = id; keep = true; }
    else if (a === 'g-auto') { S.gn.auto = !S.gn.auto; keep = true; }
    else if (a === 'auto-toggle') { var g = goalById(id); g.auto = !g.auto; }
    else if (a === 'set-def') { S.def = id; S.cur = id; }
    else if (a === 'add-recur') { S.m = null; go('money', { acc: 'mono', mode: 'in' }); S.m = { acc: 'mono', mode: 'in', cur: accById('mono').bal[0].c, rep: 'month', auto: false }; render(); return; }
    else return;
    render(keep);
  });
  render();
})();
</script>
</body>
</html>
